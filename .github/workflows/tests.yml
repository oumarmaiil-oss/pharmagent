name: Tests

on:
  push:
    branches: [rebuild/v2]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  # ── L'agent, sur les machines qu'on trouve vraiment en officine ──────────
  #
  # Référence basse : le Mac de 2015, qui s'arrête à macOS Monterey. Sa pile est
  # imposée — Playwright 1.45 et au-delà réclame macOS 13, et greenlet 2.0.2 n'a
  # pas de paquet pour Python 3.12 : c'est donc Python 3.11 + Playwright 1.37.
  #
  # Aucun runner GitHub ne tourne sous macOS 12 : l'image macos-13 a été retirée
  # en décembre 2025, et un job qui la demande attend indéfiniment une machine
  # qui n'existe plus. macos-15-intel est la dernière image Intel publiée,
  # maintenue jusqu'en août 2027 : elle couvre l'architecture du Mac de 2015 et,
  # avec Python 3.11 et Playwright 1.37, sa pile logicielle exacte. Ce qu'elle ne
  # couvre pas, c'est macOS 12 lui-même — seul le Mac de l'officine le vérifie.
  agent:
    name: Agent — ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: "Mac 2015 (Intel, Python 3.11, Playwright 1.37)"
            os: macos-15-intel
            python: "3.11"
            playwright: "playwright==1.37.0"
          - nom: "Mac récent (Apple Silicon)"
            os: macos-latest
            python: "3.12"
            playwright: "playwright>=1.47"
          - nom: "PC Windows d'officine (Python 3.11, Playwright 1.37)"
            os: windows-2022
            python: "3.11"
            playwright: "playwright==1.37.0"
          - nom: "PC Windows récent"
            os: windows-latest
            python: "3.12"
            playwright: "playwright>=1.47"
          - nom: "Linux récent"
            os: ubuntu-latest
            python: "3.12"
            playwright: "playwright>=1.47"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Playwright et son navigateur
        shell: bash
        run: |
          pip install "${{ matrix.playwright }}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi
      - name: Appariement des médicaments (doit refuser les mauvais produits)
        run: python tests/product_match.py
      - name: Remplissage d'une copie de l'ERP, garde-fou compris
        run: python tests/test_erp_fill.py agent/demo-erp.html
      - name: Reprise d'une saisie interrompue (sans doublon)
        run: python tests/resume.py
      - name: Boîte « Un problème ? » (l'agent se répare seul)
        run: python tests/diagnose.py
      - name: Mode essai sur l'ERP de démonstration
        run: python tests/demo_mode.py
      - name: Trois ERP différents x dix bons, confrontés case par case
        run: python tests/matrice_erp.py
      - name: L'agent apprend les champs qu'aucun vocabulaire ne reconnaît
        run: python tests/apprentissage.py
      - name: Le parcours du premier jour en officine
        run: python tests/premier_jour.py
      - name: Le panneau de l'agent face à un site malveillant
        run: python tests/securite_agent.py

  serveur:
    name: Serveur et interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  # ── Windows : l'installeur est réellement exécuté, pas seulement relu ──
  windows:
    name: Windows — installation réelle et saisie de bout en bout
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PHARMAGENT_HEADLESS: "1"
      PORT: "8099"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sur Windows, le runner tue l'arbre de processus a la fin de chaque etape :
      # un serveur lance dans une etape est mort dans la suivante. Toute la
      # sequence tient donc dans une seule etape.
      - name: Installation reelle, puis saisie de bout en bout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'resultat.json'
          $srvLog = Join-Path $env:RUNNER_TEMP 'serveur.log'
          $srvErr = Join-Path $env:RUNNER_TEMP 'serveur.err'

          Write-Host '--- 1. faux serveur PharmAgent ---'
          $srv = Start-Process -FilePath python -PassThru -WindowStyle Hidden `
            -ArgumentList "tests/fake_server.py","--port","$env:PORT","--out","$out" `
            -RedirectStandardOutput $srvLog -RedirectStandardError $srvErr
          $up = $false
          foreach ($i in 1..20) {
            try { Invoke-RestMethod "http://127.0.0.1:$env:PORT/ci/state" -TimeoutSec 2 | Out-Null
                  $up = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) {
            Write-Host 'Le faux serveur ne repond pas.'
            Get-Content $srvLog, $srvErr -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host '    serveur en ecoute.'

          try {
            Write-Host '--- 2. configuration de l''agent (ERP vise) ---'
            $dir = Join-Path $env:APPDATA 'PharmAgent'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            @{ erpUrl = "http://127.0.0.1:$env:PORT/erp"
               server = "http://127.0.0.1:$env:PORT" } |
              ConvertTo-Json | Set-Content -Path (Join-Path $dir 'config.json') -Encoding utf8

            Write-Host '--- 3. install.ps1, comme sur le poste d''une officine ---'
            # Le vrai serveur remplace ce marqueur au telechargement ; ici, nous.
            $script = (Get-Content agent/install.ps1 -Raw).Replace(
              '__SERVER_URL__', "http://127.0.0.1:$env:PORT")
            $installer = Join-Path $env:RUNNER_TEMP 'install.ps1'
            Set-Content -Path $installer -Value $script -Encoding utf8
            & $installer
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "install.ps1 a echoue ($LASTEXITCODE)" }

            Write-Host '--- 4. ce que l''installeur a produit ---'
            python tests/install_windows_check.py
            if ($LASTEXITCODE -ne 0) { throw 'La verification de l''installation a echoue.' }

            Write-Host '--- 5. saisie du bon de livraison par l''agent ---'
            $deadline = (Get-Date).AddMinutes(5)
            while ((Get-Date) -lt $deadline -and -not (Test-Path $out)) { Start-Sleep -Seconds 3 }
            if (-not (Test-Path $out)) { throw 'Aucun compte rendu : la chaine ne va pas au bout.' }
            $r = Get-Content $out -Raw | ConvertFrom-Json
            Write-Host "    compte rendu : $($r.status) - $($r.message)"
            $r.lines | ForEach-Object {
              Write-Host ("      ligne {0} : ok={1} {2}" -f $_.index, $_.ok, $_.message) }
            if ($r.status -ne 'done') { throw 'La saisie a echoue.' }
            $rates = @($r.lines | Where-Object { -not $_.ok })
            if ($rates.Count -gt 0) { throw "$($rates.Count) ligne(s) non saisie(s)." }
            Write-Host ''
            Write-Host 'Installation, appairage, saisie et compte rendu : verifies sur Windows.'
          }
          finally {
            Write-Host '--- journal de l''agent (panneau) ---'
            try {
              $st = Invoke-RestMethod 'http://127.0.0.1:8765/api/state' -TimeoutSec 5
              Write-Host ("version {0} | etat {1} | appaire {2} | serveur joignable {3}" -f `
                          $st.version, $st.status, $st.paired, $st.serverOk)
              if ($st.lastError) { Write-Host ("derniere erreur : {0}" -f $st.lastError) }
              $st.logs | ForEach-Object { Write-Host ("  {0}  {1}" -f $_.t, $_.msg) }
            } catch { Write-Host "Le panneau ne repond pas : $($_.Exception.Message)" }
            Write-Host '--- journal du faux serveur ---'
            Get-Content $srvLog, $srvErr -ErrorAction SilentlyContinue
            if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force }
          }
